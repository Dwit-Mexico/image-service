services:
  postgres:
    image: postgres:16-alpine
    container_name: image-service-postgres
    environment:
      POSTGRES_USER: image_service
      POSTGRES_PASSWORD: image_service_dev
      POSTGRES_DB: image_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U image_service -d image_service"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
