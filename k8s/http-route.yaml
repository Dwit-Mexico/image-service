apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: image-service-route
  namespace: default
spec:
  parentRefs:
    - name: gateway-api
      namespace: default

  hostnames:
    - "image-service.dwitmexico.com"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # El default de Envoy Gateway (route timeout 15s) cortaba /upload/video
      # durante el transcode (504). Subimos el timeout para cubrir upload+ffmpeg
      # de videos pesados (hasta 300MB / 120s). request >= backendRequest.
      timeouts:
        request: "600s"
        backendRequest: "600s"
      backendRefs:
        - name: image-service
          namespace: production
          port: 80
---
# Autoriza al HTTPRoute en `default` a referenciar Service `image-service`
# en namespace `production`. Sin esto el route falla con RefNotPermitted.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: image-service-ref-grant
  namespace: production
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: default
  to:
    - group: ""
      kind: Service
      name: image-service
