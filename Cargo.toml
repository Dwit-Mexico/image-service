[package]
name = "image-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "image-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
# image decoding (jpeg, png, gif, bmp, tiff, ico, webp) — encoding webp via webp crate
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "ico", "webp"] }
# webp encoding con control de calidad (el crate `image` solo decoda webp)
webp = "0.3"
# Azure Blob Storage + S3 (también soporta S3-compatible: MinIO, R2)
object_store = { version = "0.11", features = ["azure", "aws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
bytes = "1"
futures = "0.3"
dotenvy = "0.15"
thiserror = "2"
async-trait = "0.1"
# Envelope encryption para credenciales de storage (KEK + DEK con AES-256-GCM)
aes-gcm = "0.10"
zeroize = "1"
base64 = "0.22"
# Persistencia
sqlx = { version = "0.8", default-features = false, features = ["postgres", "uuid", "chrono", "runtime-tokio-rustls", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
# API key hashing (HMAC-SHA256)
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
# Cache async con TTL para el resolver
moka = { version = "0.12", features = ["future"] }
# Valkey/Redis client + Sentinel + pub/sub para invalidación distribuida
redis = { version = "0.27", default-features = false, features = ["tokio-rustls-comp", "sentinel"] }
