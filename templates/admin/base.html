<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}image-service admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; border-bottom: 1px solid #ddd; }
    .flash { padding: 0.75rem 1rem; border-radius: 0.4rem; margin-bottom: 1rem; }
    .flash.ok { background: #d4edda; color: #155724; }
    .flash.err { background: #f8d7da; color: #721c24; }
    .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 1rem; font-size: 0.8rem; }
    .pill.active { background: #d4edda; color: #155724; }
    .pill.revoked { background: #f8d7da; color: #721c24; }
    table { font-size: 0.9rem; }
    td.mono, .mono { font-family: ui-monospace, monospace; }
    .danger { color: #b00020; }
    .key-display { background: #fff3cd; border: 1px solid #ffeaa7; padding: 1rem; border-radius: 0.4rem; }
    .key-display code { font-size: 1.1rem; word-break: break-all; }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  {% block content %}{% endblock %}
</body>
</html>
