name: Deploy Image Service

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}/image-service" | tr '[:upper:]' '[:lower:]')"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "${IMAGE}:${SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy k8s manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "k8s/image-service/,k8s/http-route.yaml,k8s/mtls-policy.yaml"
          target: "/tmp/image-service-k8s"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHA: ${{ github.sha }}
          # Bootstrap nuevo de auth dinámica.
          # VALKEY_PASSWORD viene del Secret `valkey-auth` directo en el pod,
          # no se incluye aquí.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_KEY_V1: ${{ secrets.MASTER_KEY_V1 }}
          VALKEY_SENTINEL_ADDR: ${{ vars.VALKEY_SENTINEL_ADDR }}
          VALKEY_MASTER_NAME: ${{ vars.VALKEY_MASTER_NAME }}
          # Legacy — necesarios mientras seedeamos los proyectos en la DB.
          # Una vez que `projects` esté poblada, pueden retirarse del secret.
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          DEFAULT_CONTAINER: ${{ secrets.DEFAULT_CONTAINER }}
          PROJECT_VELVET: ${{ secrets.PROJECT_VELVET }}
          PROJECT_PIXEL_SOLIDARY: ${{ secrets.PROJECT_PIXEL_SOLIDARY }}
          PROJECT_PIXEL_SOLIDARI_DASHBOARD: ${{ secrets.PROJECT_PIXEL_SOLIDARI_DASHBOARD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: SHA,DATABASE_URL,MASTER_KEY_V1,VALKEY_SENTINEL_ADDR,VALKEY_MASTER_NAME,AZURE_STORAGE_CONNECTION_STRING,DEFAULT_CONTAINER,PROJECT_VELVET,PROJECT_PIXEL_SOLIDARY,PROJECT_PIXEL_SOLIDARI_DASHBOARD
          script: |
            IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}/image-service" | tr '[:upper:]' '[:lower:]')"
            SHA="${SHA::7}"
            NS=production

            kubectl get namespace "$NS" &>/dev/null || kubectl create namespace "$NS"

            kubectl -n "$NS" create secret generic image-service \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --from-literal=MASTER_KEY_V1="$MASTER_KEY_V1" \
              --from-literal=VALKEY_SENTINEL_ADDR="$VALKEY_SENTINEL_ADDR" \
              --from-literal=VALKEY_MASTER_NAME="$VALKEY_MASTER_NAME" \
              --from-literal=AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
              --from-literal=DEFAULT_CONTAINER="$DEFAULT_CONTAINER" \
              --from-literal=PROJECT_VELVET="$PROJECT_VELVET" \
              --from-literal=PROJECT_PIXEL_SOLIDARY="$PROJECT_PIXEL_SOLIDARY" \
              --from-literal=PROJECT_PIXEL_SOLIDARI_DASHBOARD="$PROJECT_PIXEL_SOLIDARI_DASHBOARD" \
              --dry-run=client -o yaml | kubectl apply -f -

            if kubectl -n "$NS" get deployment image-service &>/dev/null; then
              echo "Deployment exists — updating image"
            else
              echo "First deploy — applying manifests"
              kubectl apply -f /tmp/image-service-k8s/k8s/image-service/2-deployment.yaml
              kubectl apply -f /tmp/image-service-k8s/k8s/image-service/3-service.yaml
              kubectl apply -f /tmp/image-service-k8s/k8s/http-route.yaml
              kubectl apply -f /tmp/image-service-k8s/k8s/mtls-policy.yaml
            fi

            kubectl -n "$NS" set image deployment/image-service \
              image-service="${IMAGE}:${SHA}" migrate="${IMAGE}:${SHA}" seed-from-env="${IMAGE}:${SHA}"
            kubectl -n "$NS" rollout status deployment/image-service --timeout=180s
