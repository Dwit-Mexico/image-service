name: Update Secrets

on:
  workflow_dispatch:

jobs:
  update-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Update secrets and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Bootstrap (DB + KEK + Valkey). VALKEY_PASSWORD viene del Secret
          # `valkey-auth` directo en el pod, no se incluye aquí.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTER_KEY_V1: ${{ secrets.MASTER_KEY_V1 }}
          VALKEY_SENTINEL_ADDR: ${{ vars.VALKEY_SENTINEL_ADDR }}
          VALKEY_MASTER_NAME: ${{ vars.VALKEY_MASTER_NAME }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          # Legacy: solo los lee `seed-from-env` para migrar a la DB.
          # DEFAULT_CONTAINER lo usa como default_container de cada proyecto seedeado.
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          DEFAULT_CONTAINER: ${{ secrets.DEFAULT_CONTAINER }}
          PROJECT_VELVET: ${{ secrets.PROJECT_VELVET }}
          PROJECT_PIXEL_SOLIDARY: ${{ secrets.PROJECT_PIXEL_SOLIDARY }}
          PROJECT_PIXEL_SOLIDARI_DASHBOARD: ${{ secrets.PROJECT_PIXEL_SOLIDARI_DASHBOARD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DATABASE_URL,MASTER_KEY_V1,VALKEY_SENTINEL_ADDR,VALKEY_MASTER_NAME,ADMIN_USERNAME,ADMIN_PASSWORD_HASH,AZURE_STORAGE_CONNECTION_STRING,DEFAULT_CONTAINER,PROJECT_VELVET,PROJECT_PIXEL_SOLIDARY,PROJECT_PIXEL_SOLIDARI_DASHBOARD
          script: |
            NS=production
            kubectl -n "$NS" create secret generic image-service \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --from-literal=MASTER_KEY_V1="$MASTER_KEY_V1" \
              --from-literal=VALKEY_SENTINEL_ADDR="$VALKEY_SENTINEL_ADDR" \
              --from-literal=VALKEY_MASTER_NAME="$VALKEY_MASTER_NAME" \
              --from-literal=ADMIN_USERNAME="${ADMIN_USERNAME:-admin}" \
              --from-literal=ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
              --from-literal=AZURE_STORAGE_CONNECTION_STRING="$AZURE_STORAGE_CONNECTION_STRING" \
              --from-literal=DEFAULT_CONTAINER="$DEFAULT_CONTAINER" \
              --from-literal=PROJECT_VELVET="$PROJECT_VELVET" \
              --from-literal=PROJECT_PIXEL_SOLIDARY="$PROJECT_PIXEL_SOLIDARY" \
              --from-literal=PROJECT_PIXEL_SOLIDARI_DASHBOARD="$PROJECT_PIXEL_SOLIDARI_DASHBOARD" \
              --dry-run=client -o yaml | kubectl apply -f -

            if kubectl -n "$NS" get deployment image-service &>/dev/null; then
              kubectl -n "$NS" rollout restart deployment/image-service
              kubectl -n "$NS" rollout status deployment/image-service --timeout=120s
            else
              echo "deployment no existe aún — solo se actualizó el secret"
            fi
