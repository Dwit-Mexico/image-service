name: Rotate Admin Password

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Password en plano (lo eliges tú; se hashea aquí, no se reimprime)"
        required: true

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Hash password
        id: hash
        env:
          # Toma el input por env var (no como string interpolado en el shell)
          # → no se imprime en el log, y el `::add-mask::` lo redacta para el
          # resto de la corrida.
          PW: ${{ github.event.inputs.password }}
        run: |
          set -euo pipefail

          if [ -z "${PW:-}" ]; then
            echo "::error::password vacío"
            exit 1
          fi
          if [ "${#PW}" -lt 8 ]; then
            echo "::error::password mínimo 8 chars"
            exit 1
          fi

          # Enmascara el plaintext de cualquier log futuro
          echo "::add-mask::$PW"

          pip install --quiet argon2-cffi

          # Argon2id con los mismos params que `Argon2::default()` del crate
          # Rust: m=19456, t=2, p=1, hash_len=32. PHC string → interop directo.
          HASH=$(python3 - <<'PY'
          import os
          from argon2 import PasswordHasher
          ph = PasswordHasher(time_cost=2, memory_cost=19456, parallelism=1, hash_len=32)
          print(ph.hash(os.environ["PW"]))
          PY
          )

          # El hash mismo no es secreto (no se puede revertir al plain), pero
          # lo enmascaramos igual para no llenar el log con argon2 noise.
          echo "::add-mask::$HASH"
          {
            echo "hash<<EOF"
            echo "$HASH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Patch k8s secret + restart deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_HASH: ${{ steps.hash.outputs.hash }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: NEW_HASH
          script: |
            set -e
            NS=production
            HASH_B64=$(printf '%s' "$NEW_HASH" | base64 -w0)
            kubectl -n "$NS" patch secret image-service \
              --type=json \
              -p="[{\"op\":\"add\",\"path\":\"/data/ADMIN_PASSWORD_HASH\",\"value\":\"$HASH_B64\"}]"

            kubectl -n "$NS" rollout restart deployment/image-service
            kubectl -n "$NS" rollout status deployment/image-service --timeout=120s

      - name: Summary
        run: |
          {
            echo "## ✅ admin password rotada"
            echo ""
            echo "el hash se aplicó al secret \`image-service\` en \`production\`"
            echo "y el deployment se reinició."
            echo ""
            echo "usa la password que escribiste para entrar en \`/admin/login\`."
          } >> "$GITHUB_STEP_SUMMARY"
