name: Rotate Admin Password

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Password en plano (deja vacío para generar uno random de 24 chars)"
        required: false
        default: ""

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve password and hash
        id: hash
        run: |
          set -euo pipefail
          INPUT_PW="${{ github.event.inputs.password }}"

          if [ -z "$INPUT_PW" ]; then
            # 24 chars random urlsafe
            PW=$(python3 -c "import secrets; print(secrets.token_urlsafe(18))")
            echo "::add-mask::$PW"
            echo "generated random password"
          else
            PW="$INPUT_PW"
            echo "::add-mask::$PW"
            echo "using provided password"
          fi

          # Mismos params que la app (argon2id, Argon2::default() del crate Rust):
          # m=19456 KiB, t=2, p=1, hash_len=32. PHC string format → interop directo.
          pip install --quiet argon2-cffi
          HASH=$(PW="$PW" python3 - <<'PY'
          import os
          from argon2 import PasswordHasher
          ph = PasswordHasher(time_cost=2, memory_cost=19456, parallelism=1, hash_len=32)
          print(ph.hash(os.environ["PW"]))
          PY
          )
          echo "::add-mask::$HASH"
          # Pasamos por GITHUB_OUTPUT con quoting para el siguiente step
          {
            echo "pw<<EOF"
            echo "$PW"
            echo "EOF"
            echo "hash<<EOF"
            echo "$HASH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Patch k8s secret + restart deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_HASH: ${{ steps.hash.outputs.hash }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: NEW_HASH
          script: |
            set -e
            NS=production
            # Patch solo la key ADMIN_PASSWORD_HASH del secret existente
            HASH_B64=$(printf '%s' "$NEW_HASH" | base64 -w0)
            kubectl -n "$NS" patch secret image-service \
              --type=json \
              -p="[{\"op\":\"add\",\"path\":\"/data/ADMIN_PASSWORD_HASH\",\"value\":\"$HASH_B64\"}]"

            kubectl -n "$NS" rollout restart deployment/image-service
            kubectl -n "$NS" rollout status deployment/image-service --timeout=120s

      - name: Show new password in job summary
        run: |
          {
            echo "## 🔑 nueva admin password"
            echo ""
            echo '⚠️  **guárdala ahora** — no se vuelve a mostrar:'
            echo ""
            echo '```'
            echo "${{ steps.hash.outputs.pw }}"
            echo '```'
            echo ""
            echo "el hash ya fue aplicado al secret \`image-service\` en \`production\`"
            echo "y el deployment se reinició."
          } >> "$GITHUB_STEP_SUMMARY"
