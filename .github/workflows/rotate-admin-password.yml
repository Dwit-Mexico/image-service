name: Rotate Admin Password

# Toma el password en plano del Secret `ADMIN_PASSWORD_PLAIN` de este repo,
# lo hashea con argon2id en el runner, patchea el Secret `image-service` del
# cluster con `ADMIN_PASSWORD_HASH`, y reinicia el deployment.
#
# Setup inicial:
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Name:  ADMIN_PASSWORD_PLAIN
#      Value: el password en plano que quieres
#   2. Run workflow desde la pestaña Actions
#
# Para rotarlo: edita el Secret y vuelve a correr el workflow.

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Hash password
        id: hash
        env:
          PW: ${{ secrets.ADMIN_PASSWORD_PLAIN }}
        run: |
          set -euo pipefail

          if [ -z "${PW:-}" ]; then
            echo "::error::Secret ADMIN_PASSWORD_PLAIN no está configurado en este repo"
            exit 1
          fi
          if [ "${#PW}" -lt 8 ]; then
            echo "::error::password mínimo 8 chars"
            exit 1
          fi

          pip install --quiet argon2-cffi

          # Argon2id con los mismos params que `Argon2::default()` del crate
          # Rust: m=19456, t=2, p=1, hash_len=32. PHC string → interop directo.
          HASH=$(python3 - <<'PY'
          import os
          from argon2 import PasswordHasher
          ph = PasswordHasher(time_cost=2, memory_cost=19456, parallelism=1, hash_len=32)
          print(ph.hash(os.environ["PW"]))
          PY
          )

          echo "::add-mask::$HASH"
          {
            echo "hash<<EOF"
            echo "$HASH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Patch k8s secret + restart deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_HASH: ${{ steps.hash.outputs.hash }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: NEW_HASH
          script: |
            set -e
            NS=production
            HASH_B64=$(printf '%s' "$NEW_HASH" | base64 -w0)
            kubectl -n "$NS" patch secret image-service \
              --type=json \
              -p="[{\"op\":\"add\",\"path\":\"/data/ADMIN_PASSWORD_HASH\",\"value\":\"$HASH_B64\"}]"

            kubectl -n "$NS" rollout restart deployment/image-service
            kubectl -n "$NS" rollout status deployment/image-service --timeout=120s

      - name: Summary
        run: |
          {
            echo "## ✅ admin password rotada"
            echo ""
            echo "el hash se aplicó al secret \`image-service\` en \`production\`"
            echo "y el deployment se reinició."
            echo ""
            echo "para login: usa el valor actual de \`ADMIN_PASSWORD_PLAIN\` con el usuario \`admin\`."
          } >> "$GITHUB_STEP_SUMMARY"
